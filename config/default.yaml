# MECCHA CHAMELEON Trainer — default config
game:
  build: "2026.3.1"
  process: "MecchaChameleon-Win64-Shipping.exe"
  offsets:
    view_angles: 0x0
    entity_list: 0x0
    local_player: 0x0

memory:
  enabled: true
  read_only: false

overlay:
  crosshair: true
  esp_color: "#00ff8c"
  fps_cap: 60

updates:
  enabled: true
  channel: stable

plugins:
  aim_assist:
    fov: 90.0
    smoothing: 0.35
  esp:
    show_health: true
    show_names: false

hotkeys:
  AIM_TOGGLE: "ALT+F1"
  ESP_TOGGLE: "ALT+F2"
  PANIC: "ALT+DELETE"